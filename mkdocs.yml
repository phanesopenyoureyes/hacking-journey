site_name: Francisco Gutiérrez García
site_description: Portfolio de seguridad ofensiva de Francisco Gutiérrez García (alias ph4n3s) — writeups de Hack The Box, certificaciones y herramientas
site_author: Francisco Gutiérrez García
site_url: https://phanesopenyoureyes.github.io/hacking-journey/
repo_url: https://github.com/phanesopenyoureyes/hacking-journey
repo_name: hacking-journey
docs_dir: docs

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search:
      lang: es
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: simple/hackthebox
      link: https://app.hackthebox.com/users/4011018
      name: Hack The Box
    - icon: fontawesome/brands/github
      link: https://github.com/phanesopenyoureyes
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/francisco-gutierrez-garcia
      name: LinkedIn
    - icon: fontawesome/brands/discord
      link: https://discord.com/users/pacodametabaco
      name: Discord

exclude_docs: |
  _auditoria.md
